name: Weekly Sports Newsletter

on:
  schedule:
    # Run every Monday at 07:00 ET (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to look back for articles'
        required: false
        default: '7'
      draft:
        description: 'Save as draft instead of publishing'
        required: false
        default: false
        type: boolean

env:
  # Python version to use
  PYTHON_VERSION: '3.11'

jobs:
  generate-and-publish:
    name: Generate and Publish Newsletter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      # Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Install system dependencies for Playwright
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 libxtst6 xauth xvfb

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache Playwright browsers
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ matrix.python-version }}

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'

      # Run the sports news automation
      - name: Run Sports News Automation
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASS: ${{ secrets.SUBSTACK_PASS }}
          NEWSLETTER_NAME: ${{ secrets.NEWSLETTER_NAME }}
          NEWSLETTER_DESCRIPTION: ${{ secrets.NEWSLETTER_DESCRIPTION }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          python -m src --days-back ${{ github.event.inputs.days_back || '7' }} ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}

      # Upload logs on failure
      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sports-automation-logs
          path: sports_automation.log

      # Send notification on failure
      - name: Send failure notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logContent = fs.readFileSync('sports_automation.log', 'utf8');
            const message = `
            The weekly sports newsletter workflow failed. Please check the logs.
            
            Error logs:
            ${logContent.substring(0, 1000)} // Limit to first 1000 characters
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Sports Newsletter Workflow Failed",
              body: message,
              labels: ["automation-failure"]
            });